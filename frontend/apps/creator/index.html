<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      [보안 규칙 - Content Security Policy]
      이 화면이 인터넷에서 코드를 내려받아 실행하지 못하도록 막는 안전장치입니다.
      - default-src 'self' : 프로그램 안에 들어 있는 파일만 사용할 수 있습니다.
      - img-src / media-src에 file: 을 허용한 이유는, 생성된 카드 이미지와 영상이
        인터넷이 아니라 내 컴퓨터에 저장된 파일이기 때문입니다.
      블로그 전용 앱(AutoM)에는 이미 같은 규칙이 있었는데 Creator에는 빠져 있어 함께 맞췄습니다.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: data:;"
    />
    <title>AutoM Creator</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/app.css" />
  </head>
  <body class="creator-app">
    <div class="app-shell creator-shell">
      <aside class="creator-sidebar" aria-label="AutoM Creator 메뉴">
        <div class="creator-brand">
          <div class="creator-brand-mark" aria-hidden="true">M</div>
          <div class="creator-brand-copy">
            <strong>AutoM</strong>
            <span>AI 마케팅 자동화 플랫폼</span>
          </div>
        </div>

        <nav class="tabs creator-nav" aria-label="주요 메뉴">
          <button class="tab-button active" data-tab="dashboard" type="button" aria-current="page">
            <span class="creator-nav-marker" aria-hidden="true"></span>
            <span>대시보드</span>
          </button>
          <button class="creator-nav-disabled" type="button" disabled aria-label="키워드 리서치, 준비 중">
            <span class="creator-nav-marker creator-nav-marker-search" aria-hidden="true"></span>
            <span>키워드 리서치</span>
            <small>준비 중</small>
          </button>
          <button class="tab-button" data-tab="blog" type="button">
            <span class="creator-nav-marker" aria-hidden="true"></span>
            <span>블로그</span>
          </button>
          <button class="tab-button" data-tab="instagram" type="button">
            <span class="creator-nav-marker" aria-hidden="true"></span>
            <span>인스타그램</span>
          </button>
          <button class="tab-button" data-tab="youtube" type="button">
            <span class="creator-nav-marker" aria-hidden="true"></span>
            <span>유튜브</span>
          </button>
          <button class="tab-button" data-tab="history" type="button">
            <span class="creator-nav-marker" aria-hidden="true"></span>
            <span>발행 기록</span>
          </button>
          <button class="creator-nav-disabled" type="button" disabled aria-label="채널 관리, 준비 중">
            <span class="creator-nav-marker creator-nav-marker-channel" aria-hidden="true"></span>
            <span>채널 관리</span>
            <small>준비 중</small>
          </button>
          <button class="creator-nav-disabled" type="button" disabled aria-label="분석 리포트, 준비 중">
            <span class="creator-nav-marker creator-nav-marker-report" aria-hidden="true"></span>
            <span>분석 리포트</span>
            <small>준비 중</small>
          </button>
          <button class="tab-button" data-tab="settings" type="button">
            <span class="creator-nav-marker" aria-hidden="true"></span>
            <span>설정</span>
          </button>
        </nav>

        <div class="creator-sidebar-quick" aria-label="빠른 실행">
          <span>QUICK</span>
          <button type="button" data-target-tab="blog">새 콘텐츠 만들기</button>
          <button type="button" disabled aria-label="키워드 리서치, 준비 중">키워드 리서치</button>
        </div>

        <div class="creator-sidebar-status">
          <span class="creator-sidebar-avatar" aria-hidden="true">A</span>
          <div>
            <strong id="creator-sidebar-user-name">AutoM 사용자</strong>
            <span id="creator-sidebar-user-status">로컬 작업 환경</span>
          </div>
        </div>
      </aside>

      <div class="creator-main">
        <header class="creator-page-header">
          <nav class="creator-top-tabs" aria-label="콘텐츠 화면 이동">
            <button type="button" data-target-tab="blog">블로그</button>
            <button type="button" data-target-tab="instagram">인스타그램</button>
            <button type="button" data-target-tab="youtube">유튜브</button>
            <button type="button" data-target-tab="history">발행 기록</button>
            <button type="button" data-target-tab="settings">설정</button>
          </nav>
          <div class="creator-page-heading">
            <span id="creator-page-context" class="creator-page-context">콘텐츠 생성</span>
            <h1 id="creator-page-title">블로그</h1>
            <p id="creator-page-description">네이버 블로그 콘텐츠</p>
          </div>
          <span class="creator-status-badge">AutoM Creator</span>
        </header>

        <main class="app-content creator-page">
          <div class="creator-page-inner">
            <section id="tab-dashboard" class="tab-panel active"></section>
            <section id="tab-blog" class="tab-panel"></section>
            <section id="tab-instagram" class="tab-panel"></section>
            <section id="tab-youtube" class="tab-panel"></section>
            <section id="tab-history" class="tab-panel"></section>
            <section id="tab-settings" class="tab-panel"></section>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
